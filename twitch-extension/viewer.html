<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RiftSight Overlay</title>
    <style>
      /*
        The real Twitch-hosted video-overlay page. Transparent everywhere
        except tooltips/debug UI (Twitch supplies the actual video) and
        never intercepts pointer events outside an active hitbox or the
        tooltip — see #overlay-stage below. No background image/video here
        (that's the mock harness's index.html only, for local alignment
        testing).
      */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        font: 12px/1.4 sans-serif;
        color: #e6e6e6;
        overflow: hidden;
      }
      #overlay-stage {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .hitbox {
        position: absolute;
        box-sizing: border-box;
        border: 1px solid transparent;
        pointer-events: auto;
        cursor: pointer;
      }
      .hitbox.debug-outline {
        border-color: rgba(102, 255, 102, 0.6);
        background: rgba(102, 255, 102, 0.05);
      }
      .hitbox.debug-outline.hidden-card {
        border-color: rgba(255, 102, 102, 0.6);
        background: rgba(255, 102, 102, 0.05);
      }
      /* No background/border/padding on the container itself — the popup
         is just the card's own image floating over the stream, not a
         panel. Text states (fallback/debug) draw their own small
         backdrop below, since they need contrast against arbitrary video
         and no longer inherit one from this wrapper. */
      #tooltip {
        position: fixed;
        pointer-events: none;
        display: none;
        z-index: 1000;
      }
      /* max-width/max-height are deliberately NOT set here — they're
         computed per-card (portrait vs. landscape base size, scaled by the
         broadcaster's tooltipScale config) and applied as inline styles by
         viewer/main.ts's showTooltipFor, via overlay-core's
         computeTooltipMaxSize. An inline style always wins over a CSS
         class rule anyway, so a size rule here would just be dead, driftable
         duplication of the same numbers. */
      #tooltip .tooltip-art {
        display: block;
        border-radius: 6px;
        filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.6));
        /* width/height (not just a max-*) are set inline by
           viewer/main.ts's showTooltipFor, forcing every card to render at
           the same intended box regardless of its own source image's
           native resolution — RiftAtlas serves visibly lower-resolution
           art for some zones (e.g. hand/trash thumbnails) than others, and
           a bare max-width/max-height only caps growth, never upscales a
           smaller source image to match. object-fit: contain keeps the
           real aspect ratio inside that now-fixed box instead of
           stretching it. */
        object-fit: contain;
      }
      #tooltip .tooltip-fallback {
        max-width: 240px;
        background: rgba(17, 17, 17, 0.95);
        border: 1px solid #444;
        border-radius: 4px;
        padding: 6px 8px;
        font-size: 12px;
      }
      /* Only ever appended when the broadcaster's debugOutlines config is
         on — see viewer/main.ts's showTooltipFor. Normal viewers never see
         this line. */
      #tooltip .tooltip-debug {
        margin-top: 4px;
        max-width: 320px;
        background: rgba(17, 17, 17, 0.85);
        border-radius: 4px;
        padding: 4px 8px;
        color: #9fdf9f;
        font-size: 11px;
      }
      #auth-status {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 1000;
        display: none;
        background: rgba(17, 17, 17, 0.85);
        border: 1px solid #444;
        border-radius: 4px;
        padding: 4px 8px;
        pointer-events: none;
      }
      /* Development-only connection diagnostics — only ever shown when
         the broadcaster's own debug-outlines config is on (see
         viewer/main.ts's setDiagnosticStage). Never visible to a normal
         viewer by default. */
      #diagnostics {
        position: absolute;
        top: 36px;
        left: 8px;
        z-index: 1000;
        display: none;
        background: rgba(17, 17, 17, 0.85);
        border: 1px solid #444;
        border-radius: 4px;
        padding: 4px 8px;
        pointer-events: none;
        max-width: 360px;
        white-space: pre-line;
        color: #9fdf9f;
      }
    </style>
  </head>
  <body>
    <div id="auth-status"></div>
    <div id="diagnostics"></div>
    <div id="overlay-stage"></div>
    <div id="tooltip"></div>
    <!-- Twitch Extensions JS Helper — must load before dist/viewer/main.js so window.Twitch.ext exists when it runs. https://dev.twitch.tv/docs/extensions/reference/ -->
    <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
    <script src="dist/viewer/main.js"></script>
  </body>
</html>
