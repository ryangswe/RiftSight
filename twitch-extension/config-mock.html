<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RiftSight Overlay Config (mock harness)</title>
    <script>
      // See index.html for why this flag exists — same mock/real branch
      // src/config/main.ts checks.
      window.__RIFTSIGHT_MOCK__ = true;
    </script>
    <style>
      html, body { margin: 0; font: 13px/1.5 monospace; background: #1a1a2e; color: #e6e6e6; padding: 16px; }
      label { display: block; margin-bottom: 10px; }
      input[type="number"], input[type="text"] { background: #000; color: #eee; border: 1px solid #444; padding: 3px 6px; }
      button { cursor: pointer; }
      #status-text { display: block; margin-top: 10px; color: #9be89b; }
      #calibration-preview {
        position: relative;
        width: 100%;
        max-width: 480px;
        aspect-ratio: 16 / 9;
        background: #111;
        border: 1px solid #444;
        overflow: hidden;
        margin: 8px 0;
      }
      #calibration-hitboxes {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      #calibration-hitboxes .hitbox {
        position: absolute;
        box-sizing: border-box;
        border: 1px solid transparent;
      }
      #calibration-hitboxes .hitbox.debug-outline {
        border-color: rgba(102, 255, 102, 0.6);
        background: rgba(102, 255, 102, 0.05);
      }
      #calibration-hitboxes .hitbox.debug-outline.hidden-card {
        border-color: rgba(255, 102, 102, 0.6);
        background: rgba(255, 102, 102, 0.05);
      }
      #calibration-region {
        position: absolute;
        border: 2px dashed #6cf;
        background: rgba(102, 204, 255, 0.12);
        cursor: move;
        box-sizing: border-box;
      }
      #calibration-resize-handle {
        position: absolute;
        right: -6px;
        bottom: -6px;
        width: 12px;
        height: 12px;
        background: #6cf;
        border-radius: 2px;
        cursor: nwse-resize;
      }
    </style>
  </head>
  <body>
    <h3>RiftSight Overlay Settings (mock harness — saved to localStorage, not Twitch)</h3>
    <label><input id="overlay-enabled-input" type="checkbox" /> Overlay enabled</label>
    <label>
      Delay:
      <input id="delay-input" type="number" min="0" step="100" value="0" /> ms
      <button type="button" data-delay-preset="0">0s</button>
      <button type="button" data-delay-preset="2000">2s</button>
      <button type="button" data-delay-preset="5000">5s</button>
      <button type="button" data-delay-preset="10000">10s</button>
    </label>
    <label><input id="debug-outlines-input" type="checkbox" /> Debug outlines enabled</label>
    <label>
      Source aspect ratio (optional, e.g. 1.778 for 16:9):
      <input id="aspect-ratio-input" type="text" size="8" />
    </label>

    <h3>Source-region calibration</h3>
    <label>
      x: <input id="region-x-input" type="number" min="0" max="1" step="0.01" value="0" />
      y: <input id="region-y-input" type="number" min="0" max="1" step="0.01" value="0" />
      width: <input id="region-width-input" type="number" min="0" max="1" step="0.01" value="1" />
      height: <input id="region-height-input" type="number" min="0" max="1" step="0.01" value="1" />
      <button id="region-reset-button" type="button">Reset to full frame</button>
    </label>
    <label>
      Presets:
      <button type="button" data-region-preset="fullFrame">Full frame</button>
      <button type="button" data-region-preset="leftHalf">Left half</button>
      <button type="button" data-region-preset="rightHalf">Right half</button>
      <button type="button" data-region-preset="centered">Centered</button>
    </label>
    <div id="calibration-preview">
      <div id="calibration-hitboxes"></div>
      <div id="calibration-region">
        <div id="calibration-resize-handle"></div>
      </div>
    </div>

    <button id="save-button" type="button">Save</button>
    <span id="status-text"></span>
    <script src="dist/config/main.js"></script>
  </body>
</html>
