<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RiftSight Debug Viewer</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font: 13px/1.4 monospace;
        background: #0b0f16;
        color: #e6e6e6;
      }
      header {
        display: flex;
        gap: 16px;
        align-items: center;
        padding: 8px 12px;
        background: #12161f;
        border-bottom: 1px solid #2a2f3a;
        flex-wrap: wrap;
      }
      .status-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #666;
        display: inline-block;
        margin-right: 4px;
      }
      .status-dot.connected {
        background: #6f6;
      }
      .status-dot.connecting {
        background: #fc6;
      }
      .status-dot.disconnected {
        background: #f66;
      }
      label {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #session-input {
        background: #000;
        color: #eee;
        border: 1px solid #444;
        padding: 2px 4px;
      }
      #stage-wrap {
        display: flex;
        justify-content: center;
        padding: 16px;
      }
      #stage {
        position: relative;
        width: 100%;
        max-width: 1400px;
        overflow: hidden;
        /* Default aspect ratio so the stage is never a collapsed strip —
           overridden once a background image (fixture or upload) actually
           loads. A CSS-only "board" pattern shows through whenever #bg is
           hidden (no image configured, or it failed to load), so there's
           always something sensible to render hitboxes over. */
        aspect-ratio: 16 / 9;
        background:
          radial-gradient(circle at 50% 45%, #1c2b20 0%, #0c130e 72%),
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.025) 0px, rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 40px),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0px, rgba(255, 255, 255, 0.025) 1px, transparent 1px, transparent 40px);
      }
      #bg {
        display: none;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #bg.loaded {
        display: block;
      }
      #bg-controls {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      #bg-warning {
        color: #fc6;
        display: none;
      }
      #bg-warning.visible {
        display: inline;
      }
      #hitboxes {
        position: absolute;
        inset: 0;
      }
      .hitbox {
        position: absolute;
        box-sizing: border-box;
        border: 1px solid rgba(102, 255, 102, 0.6);
        background: rgba(102, 255, 102, 0.05);
        cursor: pointer;
      }
      .hitbox.hidden-card {
        border-color: rgba(255, 102, 102, 0.6);
        background: rgba(255, 102, 102, 0.05);
      }
      .hitbox.unknown-card {
        border-color: rgba(153, 153, 153, 0.6);
        background: rgba(153, 153, 153, 0.05);
      }
      .hitbox .label {
        position: absolute;
        top: -1.3em;
        left: 0;
        font-size: 10px;
        background: #111;
        padding: 1px 3px;
        white-space: nowrap;
      }
      #tooltip {
        position: fixed;
        pointer-events: none;
        background: #111;
        border: 1px solid #444;
        padding: 6px 8px;
        font-size: 12px;
        border-radius: 4px;
        display: none;
        z-index: 1000;
        max-width: 240px;
        white-space: pre-line;
      }
      #tooltip .tooltip-art {
        display: block;
        max-width: 220px;
        max-height: 260px;
        margin-bottom: 4px;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <header>
      <div><span id="status-dot" class="status-dot"></span><span id="status-text">disconnected</span></div>
      <div>Session: <input id="session-input" type="text" size="16" /> (Enter to switch)</div>
      <div>Seq: <span id="sequence-text">-</span></div>
      <div>Captured: <span id="captured-text">-</span></div>
      <label><input id="toggle-outlines" type="checkbox" checked /> Outlines</label>
      <label><input id="toggle-labels" type="checkbox" checked /> Labels</label>
      <div id="bg-controls">
        <label
          >Screenshot:
          <input id="bg-file-input" type="file" accept="image/*" />
        </label>
        <button id="bg-clear-button" type="button">Clear</button>
      </div>
      <span id="bg-warning"></span>
    </header>
    <div id="stage-wrap">
      <div id="stage">
        <img id="bg" alt="" />
        <div id="hitboxes"></div>
      </div>
    </div>
    <div id="tooltip"></div>
    <script src="dist/main.js"></script>
  </body>
</html>
